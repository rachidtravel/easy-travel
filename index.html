<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Easy Travel - السفر والنقل بسهولة</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f7f9fc;
            margin: 0;
            padding: 0;
        }
        /* Intro Video Section */
        #intro-section {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0f172a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            color: white;
            transition: opacity 0.5s ease;
        }
        #intro-section video {
            width: 80%;
            max-width: 600px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            margin-bottom: 20px;
        }
        .skip-btn {
            background: #10b981;
            color: white;
            border: none;
            padding: 10px 25px;
            font-size: 16px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
        }
        .skip-btn:hover {
            background: #059669;
        }

        /* Main App Header */
        .header {
            background: #1e293b;
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .admin-btn {
            background-color: #f59e0b;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        /* Services Grid (InDrive Style) */
        .container {
            max-width: 800px;
            margin: 20px auto;
            padding: 0 15px;
        }
        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .service-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            cursor: pointer;
            transition: transform 0.2s, border 0.2s;
            border: 2px solid transparent;
        }
        .service-card:hover, .service-card.active {
            transform: translateY(-3px);
            border-color: #10b981;
        }
        .service-card h3 {
            margin: 10px 0 0;
            color: #334155;
            font-size: 18px;
        }
        .service-icon {
            font-size: 35px;
        }

        /* Drivers List */
        .drivers-section {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .driver-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            border-bottom: 1px solid #e2e8f0;
        }
        .driver-item:last-child {
            border-bottom: none;
        }
        .admin-panel {
            display: none;
            background: #fffbeb;
            border: 1px solid #fde68a;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .delete-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- الفيديو التحفيزي في البداية -->
    <div id="intro-section">
        <h2 style="margin-bottom: 15px;">مرحباً بكم في Easy Travel 🚀</h2>
        <!-- يمكنك تغيير رابط الفيديو برابط فيديو تحفيزي جاهز -->
        <video id="introVideo" autoplay muted playsinline>
            <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
            متصفحك لا يدعم عرض الفيديو.
        </video>
        <button class="skip-btn" onclick="closeIntro()">تخطّي والدخول للتطبيق</button>
    </div>

    <div class="header">
        <h2>Easy Travel 🚗</h2>
        <button id="adminToggleBtn" class="admin-btn" onclick="toggleAdminMode()">دخول المدير</button>
    </div>

    <div class="container">
        <!-- لوحة التحكم للمدير -->
        <div id="adminPanel" class="admin-panel">
            <h3>لوحة تحكم المدير (Admin)</h3>
            <p style="color: #047857; font-weight: bold;">أنت الآن في وضع المدير لإضافة السائقين والخدمات.</p>
            <button style="background: #10b981; color: white; border: none; padding: 8px 12px; border-radius: 5px; cursor: pointer;" onclick="addDriver()">+ إضافة سائق جديد</button>
            <button style="background: #64748b; color: white; border: none; padding: 8px 12px; border-radius: 5px; cursor: pointer; margin-right: 10px;" onclick="logoutAdmin()">خروج</button>
        </div>

        <!-- اختيار الخدمات (على طريقة InDrive) -->
        <h3 style="color: #1e293b;">اختر نوع الخدمة:</h3>
        <div class="services-grid">
            <div class="service-card active" onclick="filterService('الكل', this)">
                <div class="service-icon">🌐</div>
                <h3>الكل</h3>
            </div>
            <div class="service-card" onclick="filterService('Taxi', this)">
                <div class="service-icon">🚕</div>
                <h3>طاكسي / سيارة</h3>
            </div>
            <div class="service-card" onclick="filterService('Motor', this)">
                <div class="service-icon">🏍️</div>
                <h3>موتور (دراجة)</h3>
            </div>
            <div class="service-card" onclick="filterService('Chahina', this)">
                <div class="service-icon">🚚</div>
                <h3>شاحنة نقل</h3>
            </div>
        </div>

        <!-- لائحة السائقين والمركبات المتاحة -->
        <div class="drivers-section">
            <h3 style="margin-top: 0; color: #1e293b;">السائقون المتاحون قربك:</h3>
            <div id="driversList">
                <!-- يتم تعبئتها تلقائياً -->
            </div>
        </div>
    </div>

    <script>
        // إغلاق فيديو المقدمة
        function closeIntro() {
            let intro = document.getElementById("intro-section");
            intro.style.opacity = "0";
            setTimeout(() => {
                intro.style.display = "none";
            }, 500);
        }

        // إغلاق الفيديو تلقائياً بعد انتهائه
        document.getElementById("introVideo").onended = function() {
            closeIntro();
        };

        // إدارة وضع المدير
        let isAdmin = localStorage.getItem("isAdmin") === "true";

        window.onload = function() {
            if (isAdmin) {
                showAdminUI();
            }
            loadDrivers('الكل');
        };

        function toggleAdminMode() {
            if (!isAdmin) {
                let password = prompt("أدخل كلمة سر المدير (افتراضي: 1234):");
                if (password === "1234") {
                    isAdmin = true;
                    localStorage.setItem("isAdmin", "true");
                    showAdminUI();
                    loadDrivers('الكل');
                    alert("مرحباً بك أيها المدير!");
                } else if (password !== null) {
                    alert("كلمة السر خاطئة!");
                }
            }
        }

        function showAdminUI() {
            document.getElementById("adminPanel").style.display = "block";
            document.getElementById("adminToggleBtn").style.display = "none";
        }

        function logoutAdmin() {
            isAdmin = false;
            localStorage.setItem("isAdmin", "false");
            document.getElementById("adminPanel").style.display = "none";
            document.getElementById("adminToggleBtn").style.display = "block";
            loadDrivers('الكل');
        }
<!-- قسم وسائل الدفع والمكافآت -->
<div style="background: #ffffff; padding: 20px; margin: 15px 0; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);">
    <h3 style="color: #2c3e50; margin-bottom: 15px;">💳 وسائل الدفع والعروض (Bonus)</h3>
    
    <!-- وسائل الدفع -->
    <div style="margin-bottom: 15px;">
        <h4 style="color: #34495e; font-size: 16px;">طرق الدفع المتوفرة:</h4>
        <ul style="list-style-type: none; padding: 0; color: #555;">
            <li style="padding: 5px 0;">💵 الدفع نقداً (Espèces) عند الوصول</li>
            <li style="padding: 5px 0;">💳 الدفع الإلكتروني (قريباً عبر البطاقة البنكية)</li>
            <li style="padding: 5px 0;">📱 تحويل بنكي / تطبيقات الدفع السريع</li>
        </ul>
    </div>

    <!-- Les Bonus -->
    <div style="background: #e8f8f5; padding: 12px; border-radius: 8px; border-right: 4px solid #2ecc71;">
        <h4 style="color: #27ae60; margin: 0 0 5px 0; font-size: 16px;">🎁 العروض والمكافآت (Bonus)</h4>
        <p style="margin: 0; color: #2c3e50; font-size: 14px;">استفد من خصم خاص بنسبة 10% على رحلتك الأولى مع Easy Travel، ومكافآت تشجيعية للسائقين الأنشط معنا!</p>
    </div>
</div>
        // قاعدة بيانات السائقين والخدمات المحلية
        function getDrivers() {
            let drivers = localStorage.getItem("easy_drivers");
            if (drivers) {
                return JSON.parse(drivers);
            } else {
                return [
                    { name: "يوسف الراضي", type: "Taxi", details: "مرسيدس - رقم: 12 الفحص" },
                    { name: "حمزة التجاني", type: "Motor", details: "سكوتر سريع لتوصيل الأغراض" },
                    { name: "إبراهيم الكباص", type: "Chahina", details: "شاحنة صغيرة لنقل الأثاث والبضائع" }
                ];
            }
        }

        function loadDrivers(category) {
            let drivers = getDrivers();
            let list = document.getElementById("driversList");
            list.innerHTML = "";

            let filtered = category === 'الكل' ? drivers : drivers.filter(d => d.type === category);

            if (filtered.length === 0) {
                list.innerHTML = "<p style='color: #64748b; text-align: center;'>لا توجد خدمات متاحة في هذه الفئة حالياً.</p>";
                return;
            }

            filtered.forEach((driver, index) => {
                let originalIndex = drivers.findIndex(d => d === driver);
                let deleteBtn = isAdmin ? `<button class="delete-btn" onclick="deleteDriver(${originalIndex})">حذف</button>` : '';
                
                let icon = driver.type === 'Taxi' ? '🚕' : driver.type === 'Motor' ? '🏍️' : '🚚';

                list.innerHTML += `
                    <div class="driver-item">
                        <div>
                            <h4 style="margin: 0 0 5px; color: #334155;">${icon} ${driver.name}</h4>
                            <p style="margin: 0; color: #64748b; font-size: 14px;">${driver.details}</p>
                        </div>
                        ${deleteBtn}
                    </div>
                `;
            });
        }

        function filterService(category, element) {
            document.querySelectorAll('.service-card').forEach(card => card.classList.remove('active'));
            element.classList.add('active');
            loadDrivers(category);
        }

        function addDriver() {
            let name = prompt("أدخل اسم السائق:");
            let typeInput = prompt("اختر نوع الخدمة:\n1. اكتب Taxi للسيارات/الطاكسي\n2. اكتب Motor للدراجات\n3. اكتب Chahina للشاحنات");
            let details = prompt("أدخل تفاصيل المركبة ورقم اللوحة:");

            if (name && typeInput && details) {
                let type = "Taxi";
                if (typeInput.toLowerCase().includes('motor') || typeInput.includes('موتور')) type = "Motor";
                if (typeInput.toLowerCase().includes('chahina') || typeInput.includes('شاحنة')) type = "Chahina";

                let drivers = getDrivers();
                drivers.push({ name: name, type: type, details: details });
                localStorage.setItem("easy_drivers", JSON.stringify(drivers));
                loadDrivers('الكل');
            }
        }

        function deleteDriver(index) {
            if (confirm("هل تريدจริงๆ حذف هذا السائق؟")) {
                let drivers = getDrivers();
                drivers.splice(index, 1);
                localStorage.setItem("easy_drivers", JSON.stringify(drivers));
                loadDrivers('الكل');
            }
        }
    </script>
</body>
</html>
